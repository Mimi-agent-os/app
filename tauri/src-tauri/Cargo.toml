[package]
name = "mimi"
version = "0.1.0"
description = "mimi desktop client"
edition = "2021"
rust-version = "1.77.2"

# staticlib+cdylib: mobile targets (cargo tauri android/ios) load this crate as a native library,
# not a standalone binary — see src/lib.rs and src/main.rs.
[lib]
name = "mimi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["dynamic-acl", "unstable"] }
# open_link (src/lib.rs) opens the pult's web and mail links in the system browser through it; no shell:* permission is granted
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

# a bundled macOS build delivers its own banners and hears their clicks (src/notify.rs); both crates already come with tao and wry
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSArray", "NSDictionary", "NSUserNotification"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Console"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
